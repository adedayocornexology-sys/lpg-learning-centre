<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LPG Portal &mdash; prototype</title>
<meta name="description" content="Prototype of the LPG Learning Centre portal.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFBF2">
<link rel="icon" href="assets/img/lpg-mark.svg">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>

<div class="demo">
  <b>Prototype.</b> The children and parents here are invented, not LPG pupils.
  The assistant follows a script, no model is connected yet.
</div>

<div class="app">

  <aside class="side" id="side">
    <div class="head">
      <img src="assets/img/lpg-mark.svg" alt="">
      <span class="t">LPG Portal<span id="sideRole">Nursery 2</span></span>
    </div>

    <button class="newchat" type="button" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>

    <nav class="nav" id="nav"></nav>

    <div class="whoami">
      <span class="av" id="meAv"></span>
      <span class="tx"><b id="meName"></b><span id="meRole"></span></span>
      <button class="sw" type="button" id="switch">Switch</button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <div class="bar">
      <button class="burger" type="button" id="burger" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="crumb" id="crumb">Ask LPG</span>
      <span class="right">Michaelmas term</span>
    </div>

    <div class="scrollarea" id="scrollarea">
      <div class="pane" id="pane"></div>
    </div>

    <div class="composer" id="composer">
      <div class="in">
        <textarea id="input" rows="1" placeholder="Ask about your class, or tell me what to do"></textarea>
        <button class="send" type="button" id="send" disabled aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="fine">The assistant can do anything in the sidebar for you.</p>
    </div>
  </div>

</div>

<script src="assets/portal.js"></script>
</body>
</html>
